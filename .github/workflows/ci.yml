name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate commit messages
        run: node tools/check-commits.mjs origin/${{ github.base_ref }}..HEAD

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      # The tool must be able to audit its own repository without crashing.
      - uses: ./
        with:
          upload-sarif: false
      # The docs site must build from a clean checkout.
      - run: node tools/build-site.mjs

  selfcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          upload-sarif: ${{ github.event.pull_request.head.repo.fork != true }}
