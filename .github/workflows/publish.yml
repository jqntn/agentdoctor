name: Publish

# Publishes to npm via Trusted Publishing (OIDC). No token is stored anywhere:
# GitHub mints a short-lived OIDC token for this specific workflow, and npm
# verifies it against the trusted publisher configured on the package. That also
# means every release gets a provenance attestation automatically.
#
# One-time setup on npmjs.com (only possible after the package exists - npm
# cannot configure a trusted publisher for a package that has never been
# published, and neither can `npm trust`):
#
#   npmjs.com -> agentdoctor -> Settings -> Trusted Publisher -> GitHub Actions
#     Organization or user: jqntn
#     Repository:           agentdoctor
#     Workflow filename:    publish.yml
#
# After that, cutting a release is: bump the version, tag it, publish the
# GitHub release. This workflow does the rest.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Validate without publishing'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for OIDC; without it npm falls back to token auth

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node >= 22.14.0 and npm >= 11.5.1 are the documented minimums for
      # trusted publishing. setup-node bundles an older npm, so upgrade it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: node --version && npm --version

      # Never publish a build that does not pass its own gates.
      - name: Verify
        run: |
          node --test
          node bin/agentdoctor.js . --no-user
          node tools/check-commits.mjs HEAD

      # The tag and package.json must agree, or the npm page and the GitHub
      # release will disagree about what was shipped.
      - name: Check the tag matches package.json
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "v$PKG"

      - name: Publish
        if: github.event_name == 'release' || inputs.dry-run == false
        run: npm publish --access public

      # A dry run must not try to publish the current version: once that version
      # exists, `npm publish --dry-run` always fails on the conflict and the
      # check becomes useless. Validate the tarball instead, and report whether
      # the version is still free so the answer is actionable before tagging.
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: |
          npm pack --dry-run
          NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::warning::$NAME@$VERSION is already published - bump the version before releasing"
          else
            echo "$NAME@$VERSION is unpublished and the tarball builds; ready to release"
          fi
