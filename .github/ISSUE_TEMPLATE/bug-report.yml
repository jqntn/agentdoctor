name: Bug report
description: Crashes, wrong line numbers, broken output, missed findings.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Command + minimal config. `agentdoctor --json` output helps.
      render: shell
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: agentdoctor and Node versions
      placeholder: agentdoctor 0.1.0, node 22.23.1
    validations: { required: true }
