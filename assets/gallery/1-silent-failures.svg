<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 760" width="1270" height="760" role="img" aria-label="Your agent config fails silently. This does not.">
  <rect width="1270" height="760" fill="#0B1220"/>
  <text x="60" y="86" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="42" font-weight="700" fill="#F1F5F9">Your agent config fails silently. This does not.</text>
  <text x="60" y="132" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="24" fill="#94A3B8">A misspelled hook never fires. A bad deny rule blocks nothing. Neither produces an error - until now.</text>
  <rect x="52" y="172" width="1166" height="603" rx="16" fill="#020617" stroke="#1E293B" stroke-width="2"/>
  <circle cx="88" cy="200" r="7" fill="#F87171"/><circle cx="112" cy="200" r="7" fill="#FBBF24"/><circle cx="136" cy="200" r="7" fill="#34D399"/>
  <text x="86" y="256" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#34D399" xml:space="preserve">$ </tspan><tspan fill="#E2E8F0" xml:space="preserve">npx @jqntn/agentdoctor</tspan></text><text x="86" y="307" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">agentdoctor </tspan><tspan fill="#64748B" xml:space="preserve">scanned 8 config files</tspan></text><text x="86" y="358" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#67E8F9" xml:space="preserve">.claude/settings.json</tspan></text><text x="86" y="392" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#64748B" xml:space="preserve">  5:7   </tspan><tspan fill="#F87171" xml:space="preserve">error</tspan><tspan fill="#E2E8F0" xml:space="preserve">  "bash(curl:*)" targets unknown tool "bash". Did you mean "Bash"?</tspan></text><text x="86" y="426" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#E2E8F0" xml:space="preserve">This deny rule currently blocks nothing.</tspan></text><text x="86" y="460" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#C084FC" xml:space="preserve">correctness/permission-unknown-tool</tspan></text><text x="86" y="511" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#64748B" xml:space="preserve">  17:21 </tspan><tspan fill="#F87171" xml:space="preserve">error</tspan><tspan fill="#E2E8F0" xml:space="preserve">  "SubAgentStop" is not a hook event. Did you mean "SubagentStop"?</tspan></text><text x="86" y="545" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#E2E8F0" xml:space="preserve">As written, this hook never runs.</tspan></text><text x="86" y="579" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#C084FC" xml:space="preserve">correctness/unknown-hook-event</tspan></text><text x="86" y="630" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#64748B" xml:space="preserve">  14:51 </tspan><tspan fill="#F87171" xml:space="preserve">error</tspan><tspan fill="#E2E8F0" xml:space="preserve">  Hook script ".claude/hooks/format.sh" does not exist;</tspan></text><text x="86" y="664" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#E2E8F0" xml:space="preserve">the hook will fail every time it fires.</tspan></text><text x="86" y="698" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#C084FC" xml:space="preserve">security/hook-script-not-executable</tspan></text><text x="86" y="749" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">Summary  </tspan><tspan fill="#F87171" xml:space="preserve">3 errors</tspan><tspan fill="#64748B" xml:space="preserve">  - 72 rules in 14ms</tspan></text>
  <text x="60" y="726" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="22" fill="#475569">npx @jqntn/agentdoctor &#183; 72 rules &#183; zero dependencies &#183; MIT</text>
