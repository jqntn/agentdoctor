<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 760" width="1270" height="760" role="img" aria-label="Agent config fails silently. This does not.">
  <rect width="1270" height="760" fill="#0B1220"/>
  <text x="56" y="82" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="38" font-weight="700" fill="#F1F5F9" xml:space="preserve">Agent config fails silently. This does not.</text>
  <text x="56" y="124" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#94A3B8" xml:space="preserve">A misspelled hook never fires. A bad deny rule blocks nothing. Neither errors.</text>
  <rect x="56" y="172" width="1158" height="498" rx="16" fill="#020617" stroke="#1E293B" stroke-width="2"/><circle cx="86" cy="200" r="7" fill="#F87171"/><circle cx="110" cy="200" r="7" fill="#FBBF24"/><circle cx="134" cy="200" r="7" fill="#34D399"/><text y="246" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#34D399">$ </tspan><tspan x="104.8836" fill="#E2E8F0">npx @jqntn/agentdoctor</tspan></text><text y="290" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#67E8F9">.claude/settings.json</tspan></text><text y="320" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#64748B">  5:7   </tspan><tspan x="173.5344" fill="#F87171">error</tspan><tspan x="230.7434" fill="#E2E8F0">  "bash(curl:*)" targets unknown tool "bash".</tspan></text><text y="350" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#E2E8F0">               Did you mean "Bash"? This deny rule blocks nothing.</tspan></text><text y="380" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#C084FC">               correctness/permission-unknown-tool</tspan></text><text y="424" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#64748B">  17:21 </tspan><tspan x="173.5344" fill="#F87171">error</tspan><tspan x="230.7434" fill="#E2E8F0">  "SubAgentStop" is not a hook event.</tspan></text><text y="454" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#E2E8F0">               Did you mean "SubagentStop"? This hook never runs.</tspan></text><text y="484" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#C084FC">               correctness/unknown-hook-event</tspan></text><text y="528" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#64748B">  14:51 </tspan><tspan x="173.5344" fill="#F87171">error</tspan><tspan x="230.7434" fill="#E2E8F0">  Hook script ".claude/hooks/format.sh" is missing;</tspan></text><text y="558" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#E2E8F0">               the hook fails every time it fires.</tspan></text><text y="588" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#C084FC">               security/hook-script-not-executable</tspan></text><text y="632" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#E2E8F0">Summary  </tspan><tspan x="184.9762" fill="#F87171">Grade F</tspan><tspan x="265.0688" fill="#64748B">  3 errors  - 72 rules in 14ms</tspan></text>
  <text x="56" y="730" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#475569" xml:space="preserve">npx @jqntn/agentdoctor  -  72 rules  -  zero dependencies  -  MIT</text>
</svg>
