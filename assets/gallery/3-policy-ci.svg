<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 760" width="1270" height="760" role="img" aria-label="One policy file. Every repo held to it.">
  <rect width="1270" height="760" fill="#0B1220"/>
  <text x="60" y="86" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="42" font-weight="700" fill="#F1F5F9">One policy file. Every repo held to it.</text>
  <text x="60" y="132" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="24" fill="#94A3B8">Commit agentdoctor.policy.json and CI enforces the standard. SARIF output annotates the PR diff.</text>
  <rect x="52" y="172" width="1166" height="637" rx="16" fill="#020617" stroke="#1E293B" stroke-width="2"/>
  <circle cx="88" cy="200" r="7" fill="#F87171"/><circle cx="112" cy="200" r="7" fill="#FBBF24"/><circle cx="136" cy="200" r="7" fill="#34D399"/>
  <text x="86" y="256" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#34D399" xml:space="preserve">$ </tspan><tspan fill="#E2E8F0" xml:space="preserve">cat agentdoctor.policy.json</tspan></text><text x="86" y="290" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#64748B" xml:space="preserve">{ </tspan><tspan fill="#60A5FA" xml:space="preserve">"requiredDeny"</tspan><tspan fill="#64748B" xml:space="preserve">: ["Read(./.env*)", "Read(**/.ssh/**)"],</tspan></text><text x="86" y="324" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#64748B" xml:space="preserve">  </tspan><tspan fill="#60A5FA" xml:space="preserve">"forbiddenAllow"</tspan><tspan fill="#64748B" xml:space="preserve">: ["Bash(*)", "Bash(**sudo**)"],</tspan></text><text x="86" y="358" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#64748B" xml:space="preserve">  </tspan><tspan fill="#60A5FA" xml:space="preserve">"allowedMcpServers"</tspan><tspan fill="#64748B" xml:space="preserve">: ["github", "team-**"] }</tspan></text><text x="86" y="409" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#34D399" xml:space="preserve">$ </tspan><tspan fill="#E2E8F0" xml:space="preserve">npx @jqntn/agentdoctor --no-user</tspan></text><text x="86" y="460" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#64748B" xml:space="preserve">  3:15  </tspan><tspan fill="#F87171" xml:space="preserve">error</tspan><tspan fill="#E2E8F0" xml:space="preserve">  "Bash(sudo systemctl restart api)" is forbidden</tspan></text><text x="86" y="494" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#E2E8F0" xml:space="preserve">by policy pattern "Bash(**sudo**)".</tspan></text><text x="86" y="528" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#C084FC" xml:space="preserve">policy/forbidden-allow</tspan></text><text x="86" y="579" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#64748B" xml:space="preserve">  3:37  </tspan><tspan fill="#F87171" xml:space="preserve">error</tspan><tspan fill="#E2E8F0" xml:space="preserve">  MCP server "randos-scraper" is not in the approved list.</tspan></text><text x="86" y="613" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#C084FC" xml:space="preserve">policy/unapproved-mcp-server</tspan></text><text x="86" y="664" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#64748B" xml:space="preserve">  1     </tspan><tspan fill="#F87171" xml:space="preserve">error</tspan><tspan fill="#E2E8F0" xml:space="preserve">  Policy requires deny rule "Read(**/.ssh/**)";</tspan></text><text x="86" y="698" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#E2E8F0" xml:space="preserve">not configured anywhere.</tspan></text><text x="86" y="732" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#C084FC" xml:space="preserve">policy/missing-required-deny</tspan></text><text x="86" y="783" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">Summary  </tspan><tspan fill="#F87171" xml:space="preserve">3 errors</tspan><tspan fill="#64748B" xml:space="preserve">  - exit code 1, CI blocked</tspan></text>
  <text x="60" y="726" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="22" fill="#475569">npx @jqntn/agentdoctor &#183; 72 rules &#183; zero dependencies &#183; MIT</text>
</svg>
