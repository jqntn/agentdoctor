<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 760" width="1270" height="760" role="img" aria-label="One policy file. Every repo held to it.">
  <rect width="1270" height="760" fill="#0B1220"/>
  <text x="56" y="82" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="38" font-weight="700" fill="#F1F5F9" xml:space="preserve">One policy file. Every repo held to it.</text>
  <text x="56" y="124" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#94A3B8" xml:space="preserve">Commit agentdoctor.policy.json and CI enforces the standard, with SARIF on the PR.</text>
  <rect x="56" y="172" width="1158" height="524" rx="16" fill="#020617" stroke="#1E293B" stroke-width="2"/><circle cx="86" cy="200" r="7" fill="#F87171"/><circle cx="110" cy="200" r="7" fill="#FBBF24"/><circle cx="134" cy="200" r="7" fill="#34D399"/><text y="246" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#34D399">$ </tspan><tspan x="104.8836" fill="#E2E8F0">cat agentdoctor.policy.json</tspan></text><text y="275" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#94A3B8">{ "requiredDeny":  ["Read(./.env*)", "Read(**/.ssh/**)"],</tspan></text><text y="304" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#94A3B8">  "forbiddenAllow": ["Bash(*)", "Bash(**sudo**)"],</tspan></text><text y="333" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#94A3B8">  "allowedMcpServers": ["github", "team-**"] }</tspan></text><text y="375" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#34D399">$ </tspan><tspan x="104.8836" fill="#E2E8F0">npx @jqntn/agentdoctor --no-user</tspan></text><text y="417" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#64748B">  3:15  </tspan><tspan x="173.5344" fill="#F87171">error</tspan><tspan x="230.7434" fill="#E2E8F0">  "Bash(sudo systemctl restart api)" is forbidden</tspan></text><text y="446" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#E2E8F0">               by policy pattern "Bash(**sudo**)".</tspan></text><text y="475" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#C084FC">               policy/forbidden-allow</tspan></text><text y="517" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#64748B">  3:37  </tspan><tspan x="173.5344" fill="#F87171">error</tspan><tspan x="230.7434" fill="#E2E8F0">  MCP server "randos-scraper" is not approved.</tspan></text><text y="546" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#C084FC">               policy/unapproved-mcp-server</tspan></text><text y="588" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#64748B">  1     </tspan><tspan x="173.5344" fill="#F87171">error</tspan><tspan x="230.7434" fill="#E2E8F0">  Policy requires deny rule "Read(**/.ssh/**)".</tspan></text><text y="617" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#C084FC">               policy/missing-required-deny</tspan></text><text y="659" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#E2E8F0">Summary  </tspan><tspan x="184.9762" fill="#F87171">3 errors</tspan><tspan x="276.5106" fill="#64748B">  - exit code 1, CI blocked</tspan></text>
  <text x="56" y="730" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#475569" xml:space="preserve">npx @jqntn/agentdoctor  -  zero dependencies  -  never reads your secrets  -  MIT</text>
</svg>
