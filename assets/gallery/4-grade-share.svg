<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1270 760" width="1270" height="760" role="img" aria-label="Every audit ends in a grade">
  <rect width="1270" height="760" fill="#0B1220"/>
  <text x="60" y="86" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="42" font-weight="700" fill="#F1F5F9">Every audit ends in a grade.</text>
  <text x="60" y="132" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="24" fill="#94A3B8">A+ zero findings &#183; A info only &#183; B/C warnings &#183; D/F errors. What&#8217;s yours?</text>
  <rect x="60" y="168" width="96" height="72" rx="14" fill="#0F1A2E" stroke="#1E293B" stroke-width="2"/><text x="108.0" y="216" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#34D399">A+</text><rect x="174" y="168" width="76" height="72" rx="14" fill="#0F1A2E" stroke="#1E293B" stroke-width="2"/><text x="212.0" y="216" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#34D399">A</text><rect x="268" y="168" width="76" height="72" rx="14" fill="#0F1A2E" stroke="#1E293B" stroke-width="2"/><text x="306.0" y="216" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#A3E635">B</text><rect x="362" y="168" width="76" height="72" rx="14" fill="#0F1A2E" stroke="#1E293B" stroke-width="2"/><text x="400.0" y="216" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#FBBF24">C</text><rect x="456" y="168" width="76" height="72" rx="14" fill="#0F1A2E" stroke="#1E293B" stroke-width="2"/><text x="494.0" y="216" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#FB923C">D</text><rect x="550" y="168" width="76" height="72" rx="14" fill="#0F1A2E" stroke="#1E293B" stroke-width="2"/><text x="588.0" y="216" text-anchor="middle" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#F87171">F</text>
  <rect x="52" y="300" width="760" height="408" rx="16" fill="#020617" stroke="#1E293B" stroke-width="2"/>
  <text x="86" y="336" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#64748B">$ npx @jqntn/agentdoctor --share</text>
  <text x="86" y="372" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#E2E8F0" xml:space="preserve">## agentdoctor grade: B</text><text x="86" y="438" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="22"  fill="#CBD5E1" xml:space="preserve">5 agent config files scanned - 2 warnings.</text><text x="86" y="504" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="22"  fill="#C084FC" xml:space="preserve">- `security/mcp-unpinned-package`</text><text x="86" y="537" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="22"  fill="#C084FC" xml:space="preserve">- `cost/memory-file-too-large`</text><text x="86" y="603" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="22"  fill="#CBD5E1" xml:space="preserve">Check your own agent config:</text><text x="86" y="669" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="22"  fill="#34D399" xml:space="preserve">    npx @jqntn/agentdoctor</text>
  <g transform="translate(860,330)">
    <rect width="350" height="200" rx="16" fill="#0F1A2E" stroke="#1E293B" stroke-width="2"/>
    <text x="30" y="48" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#64748B">README badge:</text>
    <rect x="30" y="72" width="188" height="40" rx="6" fill="#334155"/>
    <rect x="140" y="72" width="78" height="40" rx="6" fill="#34D399"/>
    <rect x="140" y="72" width="8" height="40" fill="#334155"/>
    <text x="46" y="99" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" fill="#F1F5F9">agentdoctor</text>
    <text x="160" y="99" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="700" fill="#04110B">A+</text>
    <text x="30" y="160" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#64748B">npx @jqntn/agentdoctor --badge</text>
  </g>
  <text x="60" y="726" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="22" fill="#475569">rule ids and counts only - never paths or snippets - safe to share from private repos</text>
</svg>
