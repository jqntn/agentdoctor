  <text x="86" y="256" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#67E8F9" xml:space="preserve">.claude/settings.json</tspan></text><text x="86" y="290" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#64748B" xml:space="preserve">  4:7   </tspan><tspan fill="#F87171" xml:space="preserve">error</tspan><tspan fill="#E2E8F0" xml:space="preserve">  "Bash(*)" auto-approves every shell command,</tspan></text><text x="86" y="324" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#E2E8F0" xml:space="preserve">including ones you have not seen.</tspan></text><text x="86" y="358" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#C084FC" xml:space="preserve">security/unrestricted-bash</tspan></text><text x="86" y="409" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#64748B" xml:space="preserve">  20:51 </tspan><tspan fill="#F87171" xml:space="preserve">error</tspan><tspan fill="#E2E8F0" xml:space="preserve">  SessionStart hook uses curl | sh; remote content is</tspan></text><text x="86" y="443" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#E2E8F0" xml:space="preserve">executed unreviewed on every trigger.</tspan></text><text x="86" y="477" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#67E8F9" xml:space="preserve">| curl -fsSL https://cdn.example.io/setup.sh | sudo bash</tspan></text><text x="86" y="511" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#C084FC" xml:space="preserve">security/hook-remote-code</tspan></text><text x="86" y="562" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#64748B" xml:space="preserve">  15:22 </tspan><tspan fill="#F87171" xml:space="preserve">error</tspan><tspan fill="#E2E8F0" xml:space="preserve">  Looks like a live GitHub token committed in settings.</tspan></text><text x="86" y="596" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#67E8F9" xml:space="preserve">| ghp_A9...4k (redacted)</tspan></text><text x="86" y="630" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#C084FC" xml:space="preserve">security/secret-in-config</tspan></text><text x="86" y="681" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#67E8F9" xml:space="preserve">.mcp.json</tspan></text><text x="86" y="715" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#64748B" xml:space="preserve">  6:44  </tspan><tspan fill="#FBBF24" xml:space="preserve">warn </tspan><tspan fill="#E2E8F0" xml:space="preserve">  MCP server launches "mcp-web-scraper@latest" unpinned,</tspan></text><text x="86" y="749" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#E2E8F0" xml:space="preserve">so its code can change under you between sessions.</tspan></text><text x="86" y="783" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" xml:space="preserve"><tspan fill="#E2E8F0" xml:space="preserve">               </tspan><tspan fill="#C084FC" xml:space="preserve">security/mcp-unpinned-package</tspan></text>
  <text x="60" y="726" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="22" fill="#475569">npx @jqntn/agentdoctor &#183; 72 rules &#183; zero dependencies &#183; MIT</text>
