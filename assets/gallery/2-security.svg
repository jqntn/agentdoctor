  <text x="60" y="86" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="42" font-weight="700" fill="#F1F5F9">The config surface is an execution surface.</text>
  <text x="60" y="132" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="24" fill="#94A3B8">22 security rules: pre-approved destructive commands, curl|sh hooks, leaked keys, unpinned MCP servers.</text>
