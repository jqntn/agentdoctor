  <text x="56" y="82" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="38" font-weight="700" fill="#F1F5F9" xml:space="preserve">The config surface is an execution surface.</text>
  <text x="56" y="124" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#94A3B8" xml:space="preserve">Pre-approved destructive commands, curl|sh hooks, leaked keys, unpinned MCP servers.</text>
  <rect x="56" y="172" width="1158" height="527" rx="16" fill="#020617" stroke="#1E293B" stroke-width="2"/><circle cx="86" cy="200" r="7" fill="#F87171"/><circle cx="110" cy="200" r="7" fill="#FBBF24"/><circle cx="134" cy="200" r="7" fill="#34D399"/><text y="246" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#67E8F9">.claude/settings.json</tspan></text><text y="275" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#64748B">  4:7   </tspan><tspan x="173.5344" fill="#F87171">error</tspan><tspan x="230.7434" fill="#E2E8F0">  "Bash(*)" auto-approves every shell command,</tspan></text><text y="304" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#E2E8F0">               including ones you have not seen.</tspan></text><text y="333" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#C084FC">               security/unrestricted-bash</tspan></text><text y="375" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#64748B">  20:51 </tspan><tspan x="173.5344" fill="#F87171">error</tspan><tspan x="230.7434" fill="#E2E8F0">  SessionStart hook uses curl | sh; the remote</tspan></text><text y="404" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#E2E8F0">               content is executed unreviewed on every trigger.</tspan></text><text y="433" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#C084FC">               security/hook-remote-code</tspan></text><text y="475" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#64748B">  15:22 </tspan><tspan x="173.5344" fill="#F87171">error</tspan><tspan x="230.7434" fill="#E2E8F0">  Live GitHub token committed in settings.</tspan></text><text y="504" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#67E8F9">               | ghp_A9...4k (redacted)</tspan></text><text y="533" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#C084FC">               security/secret-in-config</tspan></text><text y="575" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#67E8F9">.mcp.json</tspan></text><text y="604" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#64748B">  6:44  </tspan><tspan x="173.5344" fill="#FBBF24">warn </tspan><tspan x="230.7434" fill="#E2E8F0">  MCP server runs "mcp-scraper@latest" unpinned;</tspan></text><text y="633" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#E2E8F0">               its code can change under you between sessions.</tspan></text><text y="662" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="19" xml:space="preserve"><tspan x="82" fill="#C084FC">               security/mcp-unpinned-package</tspan></text>
  <text x="56" y="730" font-family="ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#475569" xml:space="preserve">npx @jqntn/agentdoctor · zero dependencies · never reads your secrets · MIT</text>
